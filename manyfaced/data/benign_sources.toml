# Benign-source allowlist (the "RIOT" analogue for issue #271).
#
# Each [[source]] entry is one known-benign class of internet-wide scanner /
# crawler whose SOLE purpose is benign measurement. A capture is tagged
# `benign` if ANY of its signals match ANY entry; the matching `name` is
# recorded in `benign_source`.
#
# Matching precedence (strongest -> weakest signal):
#   1. reverse_dns suffix  (hardest to spoof for real scanners)
#   2. asn                 (network-verifiable)
#   3. org substring       (network-verifiable)
#   4. user_agent substring (WEAK - trivially spoofed; never the sole basis)
#
# DELIBERATELY EXCLUDED: generic cloud / CDN providers (AWS, Azure, GCP,
# Cloudflare, Fastly, Akamai, ...). Their ASNs and org strings describe the
# majority of abused attacker infrastructure too - stolen credentials, malware
# C2, and phishing fronts are overwhelmingly hosted on those clouds. Whitelisting
# them by ASN/org would flip real attacker traffic to `benign` and defeat the
# entire purpose of this feature. Search-engine crawlers are included ONLY by
# verified reverse-DNS (PTR) suffix, never by their cloud ASN/org, because a bot
# claiming "Google" from an AWS IP must stay `unknown`.
#
# Keep this list SMALL and HIGH-CONFIDENCE. A false-benign (calling a real
# attacker "benign") is worse than a false-unknown, so err toward unknown.
# UA-only matches are intentionally avoided: every entry below has at least one
# network-verifiable signal (reverse_dns / asn / org), so a spoofed UA alone
# can never flip a row to benign.

[[source]]
name = "shodan"
category = "scanner"
reverse_dns = ["*.shodan.io", "*.census.shodan.io"]
asn = ["AS45102", "AS400482"]
user_agent = ["Shodan"]

[[source]]
name = "censys"
category = "scanner"
reverse_dns = ["*.censys-scanner.com"]
asn = ["AS398324"]

[[source]]
name = "binaryedge"
category = "scanner"
reverse_dns = ["*.binaryedge.io"]

[[source]]
name = "rapid7-sonar"
category = "scanner"
reverse_dns = ["*.rapid7.com", "*.sonar.labs.rapid7.com"]
asn = ["AS398324"]

[[source]]
name = "shadowserver"
category = "scanner"
# Real Shadowserver scan hosts present PTRs under BOTH shadowserver.org and
# shadowserver.io (e.g. scan-60-0.shadowserver.io) — issue #441/#514.
reverse_dns = ["*.shadowserver.org", "*.shadowserver.io"]
asn = ["AS11238", "AS400482"]

[[source]]
name = "stretchoid"
category = "scanner"
# Stretchoid internet-wide research scanner; PTRs like azpdsg1ue5fj.stretchoid.com
# (issues #441 #459 #447 #514). PTR is the network-verifiable signal.
reverse_dns = ["*.stretchoid.com"]

[[source]]
name = "onyphe"
category = "scanner"
# Onyphe research scanner; PTRs like villanueva.probe.onyphe.net
# (issues #459 #501 #447 #514).
reverse_dns = ["*.probe.onyphe.net", "*.onyphe.net"]
user_agent = ["Onyphe"]

[[source]]
name = "modat"
category = "scanner"
# Modat B.V. scanner; PTRs like o017.scanner.modat.io (issues #459 #447 #514).
reverse_dns = ["*.scanner.modat.io"]
asn = ["AS209334"]

[[source]]
name = "internet-measurement"
category = "scanner"
# Census/Driftnet InternetMeasurement project; PTRs like
# r3-77-4d.monitoring.internet-measurement.com (issues #441 #501 #514).
reverse_dns = ["*.internet-measurement.com"]
user_agent = ["InternetMeasurement"]

[[source]]
name = "infrawatch"
category = "scanner"
# Infrawatch (infrawat.ch) internet-wide research scanner; PTRs under
# *.infrawat.ch, *.internet-census.org and *.as25369.net (issues #429 #447 #514).
# Matched by PTR only — never by AS25369 org substring (issue #352).
reverse_dns = ["*.infrawat.ch", "*.internet-census.org", "*.as25369.net"]
user_agent = ["Infrawatch"]

[[source]]
name = "nokia-genomecrawler"
category = "crawler"
# Nokia GenomeCrawler internet-measurement crawler; PTRs like
# monet-07.crawler.deepfield.net (issue #510). Matched by PTR only.
reverse_dns = ["*.crawler.deepfield.net"]
user_agent = ["GenomeCrawler"]

[[source]]
name = "googlebot"
category = "crawler"
# Verified Google crawler PTR only. Google's crawler IPs reverse-resolve to
# *.googlebot.com / *.google.com; we do NOT match by ASN/org because Google's
# cloud (GCP) also hosts attackers and would otherwise be whitelisted.
reverse_dns = ["*.googlebot.com", "*.google.com"]

[[source]]
name = "bingbot"
category = "crawler"
# Verified Bing crawler PTR only (never by ASN/org for the same reason).
reverse_dns = ["*.search.msn.com", "*.msn.com"]

[[source]]
name = "visionheight"
category = "scanner"
# Verified researcher scanner. Its PTR is a single, exact host (no wildcard
# suffix), so the matcher treats it as an exact-host match — still a
# network-verifiable PTR, so it is a trustworthy benign signal.
reverse_dns = ["scan.visionheight.com"]

[[source]]
name = "university-research"
category = "research"
reverse_dns = [
    "*.rwth-aachen.de",
    "*.umich.edu",
    "*.merit.edu",
    "*.research.michigan.edu",
]
