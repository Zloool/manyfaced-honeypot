[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manyfaced"
version = "0.5.0"
description = "Multi-faced honeypot - detects and logs bot activity by emulating multiple web application faces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Zhavoronkov Pavlo", email = "zhavoronkov.p@gmail.com"},
]
urls = {Homepage = "https://github.com/Zloool/manyfaced-honeypot"}
requires-python = ">=3.11"
dependencies = [
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[project.scripts]
manyfaced = "manyfaced.mfh:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["manyfaced*"]

[tool.setuptools.package-data]
manyfaced = [
    "settings.toml.example",
    "*.py",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "E402",  # Module level import not at top of file (common in tests with sys.modules mocking)
    "F401",  # Imported but unused (common for optional dependencies like llama_cpp)
    "F841",  # Local variable assigned but never used (common in tests for coverage)
]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["E402", "F401", "F841"]
