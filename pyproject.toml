[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manyfaced"
version = "0.5.0"
description = "Multi-faced honeypot - detects and logs bot activity by emulating multiple web application faces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Zhavoronkov Pavlo", email = "zhavoronkov.p@gmail.com"},
]
urls = {Homepage = "https://github.com/Zloool/manyfaced-honeypot"}
requires-python = ">=3.13"
dependencies = [
    "cryptography>=41.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
geoip = ["geoip2>=4.0"]
dev = ["pytest>=7.0", "ruff>=0.1", "pytest-cov>=4.0"]

[project.scripts]
manyfaced = "manyfaced.mfh:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["manyfaced*"]

[tool.setuptools.package-data]
manyfaced = [
    "settings.toml.example",
    "*.py",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E402",  # Module level import not at top of file (common in tests with sys.modules mocking)
    "F401",  # Imported but unused (common for optional dependencies)
    "F841",  # Local variable assigned but never used (common in tests for coverage)
]

[tool.ruff.lint.isort]
known-first-party = ["manyfaced"]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["E402", "F401", "F841"]

[tool.pytest.ini_options]
addopts = "--cov=manyfaced --cov-report=term-missing --cov-report=xml --cov-fail-under=76"
testpaths = ["test"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = false
ignore-module = false
fail-under = 80
exclude = ["test", "build", ".venv"]
verbose = 1
omit-covered-files = true
