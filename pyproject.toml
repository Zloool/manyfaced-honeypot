[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manyfaced"
version = "0.5.0"
description = "Multi-faced honeypot - detects and logs bot activity by emulating multiple web application faces"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Zhavoronkov Pavlo", email = "zhavoronkov.p@gmail.com"},
]
urls = {Homepage = "https://github.com/Zloool/manyfaced-honeypot"}
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
dev = ["pytest>=7.0", "pytest-timeout>=2.1", "ruff==0.15.22", "pytest-cov>=4.0", "basedpyright>=1.39", "pyyaml>=6.0"]

[project.scripts]
manyfaced = "manyfaced.mfh:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["manyfaced*"]

[tool.setuptools.package-data]
manyfaced = [
    "settings.toml.example",
    "*.py",
    "data/*.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.ruff.lint]
ignore = [
    "E402",  # Module level import not at top of file (common in tests with sys.modules mocking)
]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["E402", "F401", "F841"]

[tool.pytest.ini_options]
# Coverage is OPT-IN for ad-hoc local runs: it makes every run measurably
# slower and is rarely what you want while iterating on a test. Use
# `uv run pytest --cov` (or the `make cov` target) when you want the gate.
# CI's `test` job passes the --cov flags explicitly so the 76% gate still
# blocks merges (see .github/workflows/ci.yml).
addopts = "-v --timeout=60"
testpaths = ["test"]

[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-private = false
ignore-module = false
fail-under = 80
exclude = ["test", "build", ".venv"]
verbose = 1
omit-covered-files = true

[tool.basedpyright]
typeCheckingMode = "basic"
include = ["manyfaced"]
exclude = [".venv", "__pycache__", "*.egg-info"]
# Suppress noisy rules that are common in a codebase without extensive type annotations
reportMissingTypeArgument = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportAny = false
reportUnusedCallResult = false
reportUnusedVariable = false
# Rules now fixed — back to error level for CI gatekeeping
reportIncompatibleMethodOverride = true  # send_error override was fixed
reportAttributeAccessIssue = "warning"   # bearstorage uses Any for parsed_request (union of types)
reportArgumentType = true                # config.py casts added
reportReturnType = "warning"             # still some dynamic typing in handlers
reportOptionalMemberAccess = "warning"   # optional chaining in report_sender is intentional
reportInvalidTypeForm = "warning"        # multiprocessing.Event has no proper type stubs
reportGeneralTypeIssues = true           # bearstorage uses Any for parsed_request (union of types)
reportRedeclaration = true               # fixed by renaming shadowed variables
reportCallIssue = true                   # config.py casts added
reportIndexIssue = "warning"             # some index access patterns remain
