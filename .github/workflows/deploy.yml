name: Deploy to Droplet

# Post-merge deploy only (issue #256).
#
# Triggers:
#   - push to master → deploy the just-merged commit (validation already green
#     on the PR via ci.yml, which branch protection required before merge).
#   - manual dispatch → pick any ref and deploy it.
#
# This workflow does NOT re-run lint/test/typecheck/security/canary — that would
# duplicate the pre-merge gate. The squashed commit is identical to what ci.yml
# validated, so re-validating post-merge is definitionally redundant.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to deploy'
        required: true
        default: 'master'

permissions:
  contents: read

# Serialize deploys against the shared venv. New deploys queue behind
# in-progress ones; never cancel mid-install (could leave droplet broken).
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  build-and-push-image:
    # Issue #149 (partial): make the container image a real, pinned, reproducible
    # deploy artifact. Builds the #146 Dockerfile and pushes it to GHCR tagged
    # with the commit SHA (immutable) plus :latest (rollback pointer).
    #
    # This only BUILDS + PUSHES the artifact — it does NOT touch the droplet.
    # The droplet-side cutover (install Docker, stop systemd, `docker run`) is a
    # separate, explicit step once the host is container-ready. Kept non-blocking
    # so a registry hiccup never blocks the systemd deploy or merges.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact commit to build
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve commit SHA
        id: sha
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building image for SHA: ${SHORT_SHA}"

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # sha-<12> is immutable; :latest is the live pointer used for rollback.
          tags: |
            ghcr.io/zloool/manyfaced-honeypot:sha-${{ steps.sha.outputs.short_sha }}
            ghcr.io/zloool/manyfaced-honeypot:latest
          # SBOM + provenance make the artifact auditable (pairs with #149 goals).
          sbom: true
          provenance: true

      - name: Record image digest
        run: |
          set -euo pipefail
          echo "Pushed: ghcr.io/zloool/manyfaced-honeypot:sha-${{ steps.sha.outputs.short_sha }}"
          echo "Rollback target for a future cutover: previous sha-<short> tag in GHCR"

  deploy:
    # Post-merge deploy. No validation deps — ci.yml already gated the commit
    # on the PR (branch protection required those checks green before merge).
    needs: [build-and-push-image]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout exact commit to deploy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Resolve commit SHA
        id: sha
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying short SHA: ${SHORT_SHA}"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      # Host keys are accepted on first connection via StrictHostKeyChecking=
      # accept-new on each ssh call below (no separate ssh-keyscan, which can
      # hang/fail intermittently over a custom port).

      - name: Migrate legacy deployment to release-symlink scheme
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail

          # Only migrate if current is not yet a symlink (first deploy with new mechanism)
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "
            set -euo pipefail && \
            if [ ! -L /opt/manyfaced/current ]; then \
              mkdir -p /opt/manyfaced/releases && \
              PRE_DIR=\"/opt/manyfaced/releases/pre-symlink\" && \
              mkdir -p \"\$PRE_DIR\" && \
              if [ -d /opt/manyfaced/manyfaced ]; then \
                mv /opt/manyfaced/manyfaced \"\$PRE_DIR/\"; \
              fi && \
              ln -sfn \"\$PRE_DIR\" \"/opt/manyfaced/current.new\" && \
              mv -Tf \"/opt/manyfaced/current.new\" \"/opt/manyfaced/current\" && \
              echo 'Migrated legacy deployment to releases/pre-symlink'; \
            else \
              echo 'Already using release-symlink scheme — no migration needed'; \
            fi"

      - name: Rsync commit to staging directory
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail

          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          STAGING_DIR="/opt/manyfaced/releases/${SHORT_SHA}"

          # Clean staging dir if re-deploying same commit (idempotent)
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "rm -rf ${STAGING_DIR} && mkdir -p ${STAGING_DIR}"

          # Rsync ALL repo files into staging dir. --delete is safe because
          # the staging directory is per-commit and starts empty.
          rsync -avz --delete \
            -e "ssh -p ${DROPLET_SSH_PORT}" \
            --exclude='.git/' \
            --exclude='.venv/' \
            --exclude='__pycache__/' \
            --exclude='*.egg-info/' \
            --exclude='.ruff_cache/' \
            --exclude='.pytest_cache/' \
            --exclude='deployment-analysis/' \
            --exclude='prod-backup/' \
            --exclude='bots/' \
            --exclude='coverage.xml' \
            --exclude='*.db' \
            --exclude='*.log' \
            --exclude='honeypot.env' \
            . \
            "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}:${STAGING_DIR}/"

      - name: Install Python dependencies
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail

          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          STAGING_DIR="/opt/manyfaced/releases/${SHORT_SHA}"

          # Install BEFORE symlink swap so the swap can't expose a release
          # whose deps aren't installed. Full pip output shown in workflow log;
          # tee also saves to droplet-side file for debugging.
          #
          # Pinned via the committed uv.lock (issue #220): bootstrap uv if
          # absent, export the locked runtime requirements, install them into
          # the existing pip-created venv with uv pip install -r, then install
          # the project editable on top (its deps are already pinned, so pip
          # does not re-resolve). Transitive versions match the lock exactly.
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "
            set -euo pipefail && \
            command -v uv >/dev/null 2>&1 || curl -LsSf https://astral.sh/uv/install.sh | sh && \
            export PATH=\"\$HOME/.local/bin:\$PATH\" && \
            cd ${STAGING_DIR} && \
            uv export --locked --no-dev --format requirements-txt -o /tmp/mfh-req.lock.txt && \
            uv pip install --python /opt/manyfaced/venv -r /tmp/mfh-req.lock.txt 2>&1 | tee /opt/manyfaced/deploy-${SHORT_SHA}.log && \
            /opt/manyfaced/venv/bin/pip install -e ${STAGING_DIR} >> /opt/manyfaced/deploy-${SHORT_SHA}.log 2>&1"

      - name: Atomically swap release symlink
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail

          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          STAGING_DIR="/opt/manyfaced/releases/${SHORT_SHA}"

          # ln -sfn alone is NOT atomic (it unlinks then symlinks).
          # The current.new intermediate + mv -Tf guarantees a single
          # rename(2) syscall — the service never observes a partial state.
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "
            set -euo pipefail && \
            ln -sfn '${STAGING_DIR}' '/opt/manyfaced/current.new' && \
            mv -Tf '/opt/manyfaced/current.new' '/opt/manyfaced/current'"

      - name: Update systemd unit and restart service
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail

          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          STAGING_DIR="/opt/manyfaced/releases/${SHORT_SHA}"

          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "
            set -euo pipefail && \
            cp ${STAGING_DIR}/systemd/manyfaced.service /etc/systemd/system/manyfaced.service && \
            systemctl daemon-reload && \
            systemctl restart manyfaced && \
            sleep 3 && \
            if [ \"\$(systemctl is-active manyfaced)\" = \"active\" ]; then \
              echo 'Service started successfully'; \
            else \
              echo 'FAIL: Service not active after restart' && exit 1; \
            fi"

      - name: Health check (ports)
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail

          # Health check: verify every port in HONEY_TOP_PORTS is in LISTEN state.
          # Uses per-port ss filter syntax (sport = :PORT) — no regex over ss output.
          # Expands ranges (e.g. 11300-11311 → individual ports). Retries up to
          # 10 times with 3s sleep for a total 30-second budget on startup.
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" 'bash -c '"'"'
            set -euo pipefail

            # Read HONEY_TOP_PORTS from the droplet env file (source of truth)
            PORTS_RAW=$(grep "^HONEY_TOP_PORTS=" /opt/manyfaced/honeypot.env 2>/dev/null | cut -d= -f2)
            if [ -z "$PORTS_RAW" ]; then echo "ERROR: HONEY_TOP_PORTS not found in honeypot.env"; exit 1; fi

            # Expand port list: split on commas, expand ranges via seq, validate tokens
            PORT_LIST=""
            for token in $(echo "$PORTS_RAW" | tr "," "\n"); do
              if echo "$token" | grep -qP "^[0-9]+-[0-9]+$"; then
                # Range like 11300-11311 → expand to individual ports
                PORT_LIST="$PORT_LIST $(seq $token)"
              elif echo "$token" | grep -qP "^[0-9]+$"; then
                # Single port — keep as-is
                PORT_LIST="$PORT_LIST $token"
              else
                echo "ERROR: malformed port token \"$token\" in HONEY_TOP_PORTS"
                exit 1
              fi
            done

            # Normalize to one-port-per-line, strip blanks
            PORT_LIST=$(echo "$PORT_LIST" | tr -s " \t\n" "\n" | grep -v "^$")
            TOTAL=$(echo "$PORT_LIST" | wc -l)

            echo "Checking $TOTAL ports from HONEY_TOP_PORTS ..."

            # Retry loop: up to 10 iterations × 3 s = 30 s budget
            MAX_RETRIES=10
            for (( i=1; i<=MAX_RETRIES; i++ )); do
              MISSING=""
              while read -r p; do
                if ! ss -Htln "sport = :$p" | grep -q LISTEN; then
                  MISSING="$MISSING $p"
                fi
              done <<< "$PORT_LIST"

              # Trim leading space
              MISSING="${MISSING# }"

              if [ -z "$MISSING" ]; then
                echo "Health check OK: $TOTAL/$TOTAL ports listening"
                exit 0
              fi

              if [ "$i" -lt "$MAX_RETRIES" ]; then
                MISSING_COUNT=$(echo "$MISSING" | wc -w)
                echo "Iteration $i: $MISSING_COUNT port(s) not yet listening, retrying ..."
                sleep 3
              else
                echo "FAIL: ports never reached LISTEN state after $MAX_RETRIES attempts:"
                while read -r p; do
                  echo "  MISSING: $p"
                done <<< "$MISSING"
                exit 1
              fi
            done
          '"'"''

      - name: Verify recording actually works (not just ports listening)
        # Ports-only health checks pass even when DB writes silently fail
        # (the 2026-07 silent-stop). Run the DB-write verification on the
        # droplet so a deploy that breaks recording fails the gate.
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "bash /opt/manyfaced/scripts/verify_deploy.sh"

      - name: Clean up old releases (keep last 5)
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail

          # Keep last 5 releases under /opt/manyfaced/releases/. Never delete
          # current's target even if it falls outside the last 5 (defensive).
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "
            set -euo pipefail && \
            CURRENT_TARGET=\$(readlink -f /opt/manyfaced/current) && \
            ls -1dt /opt/manyfaced/releases/*/ | grep -v \"^\${CURRENT_TARGET}/\$\" | tail -n +6 | xargs -r rm -rf && \
            echo 'Old releases cleaned up (keeping last 5)' && \
            "
