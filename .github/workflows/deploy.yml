name: Deploy to Droplet

# Post-merge deploy only (issue #256).
#
# Triggers:
#   - push to master → deploy the just-merged commit (validation already green
#     on the PR via ci.yml, which branch protection required before merge).
#   - manual dispatch → pick any ref and deploy it.
#
# This workflow does NOT re-run lint/test/typecheck/security/canary — that would
# duplicate the pre-merge gate. The squashed commit is identical to what ci.yml
# validated, so re-validating post-merge is definitionally redundant.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to deploy'
        required: true
        default: 'master'

permissions:
  contents: read

# Serialize deploys against the shared venv. New deploys queue behind
# in-progress ones; never cancel mid-install (could leave droplet broken).
concurrency:
  group: deploy-droplet
  cancel-in-progress: false

jobs:
  build-and-push-image:
    # Issue #149 (partial): make the container image a real, pinned, reproducible
    # deploy artifact. Builds the #146 Dockerfile and pushes it to GHCR tagged
    # with the commit SHA (immutable) plus :latest (rollback pointer).
    #
    # This only BUILDS + PUSHES the artifact — it does NOT touch the droplet.
    # The droplet-side cutover (docker run) is a separate step in the deploy job.
    # Kept non-blocking so a registry hiccup never blocks the deploy or merges.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact commit to build
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve commit SHA
        id: sha
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Building image for SHA: ${SHORT_SHA}"

      - name: Build and push image to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          # sha-<12> is immutable; :latest is the live pointer used for rollback.
          tags: |
            ghcr.io/zloool/manyfaced-honeypot:sha-${{ steps.sha.outputs.short_sha }}
            ghcr.io/zloool/manyfaced-honeypot:latest
          # SBOM + provenance make the artifact auditable (pairs with #149 goals).
          sbom: true
          provenance: true

      - name: Record image digest
        run: |
          set -euo pipefail
          echo "Pushed: ghcr.io/zloool/manyfaced-honeypot:sha-${{ steps.sha.outputs.short_sha }}"
          echo "Rollback target for a future cutover: previous sha-<short> tag in GHCR"

  deploy:
    # Post-merge deploy. No validation deps — ci.yml already gated the commit
    # on the PR (branch protection required those checks green before merge).
    needs: [build-and-push-image]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout exact commit to deploy
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Resolve commit SHA
        id: sha
        run: |
          set -euo pipefail
          SHORT_SHA=$(git rev-parse --short=12 HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Deploying short SHA: ${SHORT_SHA}"

      - name: Set up SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      # Host keys are accepted on first connection via StrictHostKeyChecking=
      # accept-new on each ssh call below (no separate ssh-keyscan, which can
      # hang/fail intermittently over a custom port).

      # ── Container-based deploy (issue #149) ──────────────────────────────
      # The honeypot now runs as a pinned GHCR image instead of a
      # rsync'd venv + systemd unit. The image is built by the
      # build-and-push-image job (tagged sha-<short_sha> and :latest).
      # Rollback = re-pin the container to a previously deployed image tag.
      # ── Disk-space guard (issue #419) ────────────────────────────────────
      # The droplet accumulates per-commit sha-<12> image tags. The post-deploy
      # cleanup only ran `docker image prune -f` (dangling-only) AND only after a
      # successful deploy, so tagged images piled up until the root fs hit 100%
      # and every deploy failed at image extraction ("no space left on device").
      # Reclaim space BEFORE the pull so a near-full droplet self-heals. This is
      # safe: rollback re-pulls its target from GHCR (immutable tags) and the
      # currently-running container's image is never removed by prune.
      - name: Reclaim disk before pull (prune unused images + build cache)
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" '
            set -euo pipefail
            echo "Disk before reclaim:"; df -h / | tail -1
            # Prune unused images (not just dangling) and build cache. Images
            # referenced by the running container are protected automatically.
            docker image prune -af >/dev/null 2>&1 || true
            docker builder prune -af >/dev/null 2>&1 || true
            echo "Disk after reclaim:"; df -h / | tail -1
          '

      - name: Authenticate to GHCR and pull release image
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          set -euo pipefail

          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):sha-${SHORT_SHA}"

          # Re-authenticate on the droplet only if a pull token is provided;
          # otherwise rely on the droplet's existing docker login (cached in
          # /root/.docker/config.json from the manual cutover).
          if [ -n "${GHCR_TOKEN}" ]; then
            ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "echo \"${GHCR_TOKEN}\" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          fi

          # GHCR is eventually consistent — a just-pushed tag may take a few
          # seconds to be visible. Retry the pull (on the runner side, looping
          # ssh calls) so a brief registry propagation delay doesn't fail the
          # whole deploy. The retry loop lives OUTSIDE the ssh string to avoid
          # bash quoting/set -u pitfalls.
          PULLED=""
          for i in 1 2 3 4 5; do
            if ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "docker pull '${IMAGE}'"; then
              PULLED=1
              break
            fi
            echo "pull attempt ${i} failed, retrying in 5s..."
            sleep 5
          done
          [ -n "${PULLED}" ] || { echo "FAIL: could not pull ${IMAGE}"; exit 1; }
          echo "Pulled ${IMAGE}"

      - name: Prepare host mounts (config dir + writable log paths)
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail

          # The container runs as the host 'honeypot' uid (1001) so it can
          # write the shared /opt/manyfaced/bots SQLite volume. Config is
          # mounted read-only into XDG_CONFIG_HOME (the image's own
          # /home/honeypot is owned by a different uid and not traversable).
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "
            set -euo pipefail && \
            mkdir -p /opt/manyfaced/host-config/manyfaced /opt/manyfaced/bots && \
            chown -R honeypot:honeypot /opt/manyfaced/host-config /opt/manyfaced/bots && \
            # Ensure the deploy env file points logs/dumps at the writable
            # bots volume (container HOME is set to /opt/manyfaced/bots so the
            # default ~-based log path is also writable).
            grep -q '^HONEY_LOG_FILE=' /opt/manyfaced/honeypot.env || printf 'HONEY_LOG_FILE=/opt/manyfaced/bots/honeypot.log\n' >> /opt/manyfaced/honeypot.env; \
            grep -q '^HONEY_DUMP_FILE=' /opt/manyfaced/honeypot.env || printf 'HONEY_DUMP_FILE=/opt/manyfaced/bots/dump.jsonl\n' >> /opt/manyfaced/honeypot.env; \
            echo 'Host mounts ready'"

      - name: Stop legacy systemd service (first cutover only) and launch container
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail

          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):sha-${SHORT_SHA}"

          # Container flags (validated on prod, 2026-07-08):
          #   --network host           honeypot binds many low/high ports; the
          #                             droplet's nft REDIRECT (80->8080 etc.)
          #                             keeps working, so no port-map juggling.
          #   --user 1001:1001         matches host 'honeypot' uid so the
          #                             bind-mounted bots volume (SQLite) is
          #                             writable.
          #   --env HOME=/opt/manyfaced/bots
          #                             default log path (~/.local/...) lands on
          #                             the writable volume.
          #   --env XDG_CONFIG_HOME=/opt/manyfaced/host-config
          #                             config discovery reads the mounted
          #                             honeypot config.toml (read-only).
          #   --env-file honeypot.env   same config the old systemd unit used
          #                             (incl. HONEY_PORT=top, now safe).
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "
            set -euo pipefail && \
            # Disable the legacy systemd unit if it is still active (idempotent).
            if systemctl is-active --quiet manyfaced 2>/dev/null && [ -f /etc/systemd/system/manyfaced.service ]; then \
              systemctl stop manyfaced; systemctl disable manyfaced 2>/dev/null || true; \
              echo 'Legacy systemd unit stopped+disabled'; \
            else \
              echo 'No legacy systemd unit active'; \
            fi && \
            docker rm -f manyfaced 2>/dev/null || true && \
            docker run -d --name manyfaced --restart unless-stopped --network host --user 1001:1001 \
              --env HOME=/opt/manyfaced/bots --env XDG_CONFIG_HOME=/opt/manyfaced/host-config \
              --env-file /opt/manyfaced/honeypot.env \
              -v /home/honeypot/.config/manyfaced:/opt/manyfaced/host-config/manyfaced:ro \
              -v /opt/manyfaced/bots:/opt/manyfaced/bots \
              '${IMAGE}' && \
            echo 'Container launched: ${IMAGE}'"

      - name: Health check (ports)
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail

          # Health check: verify every port in HONEY_TOP_PORTS is in LISTEN state.
          # Uses per-port ss filter syntax (sport = :PORT) — no regex over ss output.
          # Expands ranges (e.g. 11300-11311 → individual ports). Retries up to
          # 10 times with 3s sleep for a total 30-second budget on startup.
          #
          # WHY the dashboard port (18889) is checked too (issue #348): the
          # dashboard listens on 127.0.0.1:18889 and is exposed publicly via nginx
          # :29999. The honeypot container is recreated on every deploy
          # (docker rm -f + docker run); during image-pull + Python-start the
          # dashboard socket is dead, so nginx returns 502/504. A ports-only check
          # passes while :29999 is down, so the deploy wrongly reports SUCCESS.
          # Checking 18889 here makes the gate wait for the dashboard to come up.
          # NOTE for operators: the nginx site /etc/nginx/sites-available/
          # manyfaced-dashboard should set `proxy_connect_timeout 5s;` and
          # `proxy_read_timeout 30s;` on `location /` (it currently does NOT) so
          # nginx fails fast instead of returning a hard 60s-default 504. This repo
          # does not carry a copy of that conf — add the timeouts on the droplet.
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" 'bash -c '"'"'
            set -euo pipefail

            # Read HONEY_TOP_PORTS from the droplet env file (source of truth)
            PORTS_RAW=$(grep "^HONEY_TOP_PORTS=" /opt/manyfaced/honeypot.env 2>/dev/null | cut -d= -f2)
            if [ -z "$PORTS_RAW" ]; then echo "ERROR: HONEY_TOP_PORTS not found in honeypot.env"; exit 1; fi

            # Expand port list: split on commas, expand ranges via seq, validate tokens
            PORT_LIST=""
            for token in $(echo "$PORTS_RAW" | tr "," "\n"); do
              if echo "$token" | grep -qP "^[0-9]+-[0-9]+$"; then
                # Range like 11300-11311 → expand to individual ports
                PORT_LIST="$PORT_LIST $(seq $token)"
              elif echo "$token" | grep -qP "^[0-9]+$"; then
                # Single port — keep as-is
                PORT_LIST="$PORT_LIST $token"
              else
                echo "ERROR: malformed port token \"$token\" in HONEY_TOP_PORTS"
                exit 1
              fi
            done

            # Normalize to one-port-per-line, strip blanks
            PORT_LIST=$(echo "$PORT_LIST" | tr -s " \t\n" "\n" | grep -v "^$")
            TOTAL=$(echo "$PORT_LIST" | wc -l)

            # Dashboard port: the honeypot dashboard binds 127.0.0.1:18889 and is
            # proxied by nginx on :29999. Read it from the env file (issue #348),
            # fall back to 18889 if absent. Must be LISTEN before we declare success.
            DASHBOARD_PORT_RAW=$(grep "^HONEY_DASHBOARD_PORT=" /opt/manyfaced/honeypot.env 2>/dev/null | cut -d= -f2)
            DASHBOARD_PORT=${DASHBOARD_PORT_RAW:-18889}

            echo "Checking $TOTAL ports from HONEY_TOP_PORTS + dashboard port $DASHBOARD_PORT ..."

            # Retry loop: up to 10 iterations × 3 s = 30 s budget
            MAX_RETRIES=10
            for (( i=1; i<=MAX_RETRIES; i++ )); do
              MISSING=""
              while read -r p; do
                if ! ss -Htln "sport = :$p" | grep -q LISTEN; then
                  MISSING="$MISSING $p"
                fi
              done <<< "$PORT_LIST"

              # Dashboard port check (issue #348): ensures the dashboard socket is
              # actually up, not just the honeypot ports. Without this a deploy can
              # report success while nginx :29999 serves 502/504.
              if ! ss -Htln "sport = :$DASHBOARD_PORT" | grep -q LISTEN; then
                MISSING="$MISSING $DASHBOARD_PORT"
              fi

              # Trim leading space
              MISSING="${MISSING# }"

              if [ -z "$MISSING" ]; then
                echo "Health check OK: $TOTAL/$TOTAL ports listening + dashboard :$DASHBOARD_PORT"
                exit 0
              fi

              if [ "$i" -lt "$MAX_RETRIES" ]; then
                MISSING_COUNT=$(echo "$MISSING" | wc -w)
                echo "Iteration $i: $MISSING_COUNT port(s) not yet listening, retrying ..."
                sleep 3
              else
                echo "FAIL: ports never reached LISTEN state after $MAX_RETRIES attempts:"
                while read -r p; do
                  echo "  MISSING: $p"
                done <<< "$MISSING"
                exit 1
              fi
            done
          '"'"''

      - name: Verify recording actually works (not just ports listening)
        # Ports-only health checks pass even when DB writes silently fail
        # (the 2026-07 silent-stop). Run the DB-write verification on the
        # droplet so a deploy that breaks recording fails the gate.
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "bash /opt/manyfaced/scripts/verify_deploy.sh"

      - name: Record deployed image tag + prune old images
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail

          SHORT_SHA="${{ steps.sha.outputs.short_sha }}"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]'):sha-${SHORT_SHA}"

          # Persist the deployed tag so the rollback step can re-pin to the
          # previously known-good image. Keep the last 5 tags.
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "
            set -euo pipefail && \
            echo '${IMAGE}' >> /opt/manyfaced/deployed-images.log && \
            tail -n 5 /opt/manyfaced/deployed-images.log > /opt/manyfaced/deployed-images.log.tmp && \
            mv -f /opt/manyfaced/deployed-images.log.tmp /opt/manyfaced/deployed-images.log && \
            # Prune dangling images, keep the last 5 named tags.
            docker image prune -f >/dev/null 2>&1 || true && \
            echo 'Recorded deployed image: ${IMAGE}'"

      - name: Rollback on failure
        if: failure()
        env:
          DROPLET_SSH_PORT: ${{ secrets.DROPLET_SSH_PORT }}
          DROPLET_SSH_USER: ${{ secrets.DROPLET_SSH_USER }}
          DROPLET_SERVER_IP: ${{ secrets.DROPLET_SERVER_IP }}
        run: |
          set -euo pipefail

          # Re-pin the container to the previously deployed image tag.
          # Resolve PREV_IMG on the droplet, then pull (with runner-side retry)
          # and re-launch — all kept OUTSIDE a single ssh string to avoid the
          # bash quoting/set -u pitfalls that broke the earlier loop.
          PREV_IMG=$(ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "
            if [ ! -f /opt/manyfaced/deployed-images.log ]; then echo 'NO_LOG'; exit 0; fi
            CURRENT_IMG=\$(docker inspect --format='{{.Config.Image}}' manyfaced 2>/dev/null || true)
            grep -v \"^\${CURRENT_IMG}\$\" /opt/manyfaced/deployed-images.log | tail -1")

          if [ -z "${PREV_IMG}" ] || [ "${PREV_IMG}" = "NO_LOG" ]; then
            echo 'No prior image tag to roll back to — manual intervention required'
            exit 1
          fi

          PULLED=""
          for i in 1 2 3 4 5; do
            if ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "docker pull '${PREV_IMG}'"; then
              PULLED=1
              break
            fi
            echo "rollback pull attempt ${i} failed, retrying in 5s..."
            sleep 5
          done
          [ -n "${PULLED}" ] || { echo "FAIL: could not pull ${PREV_IMG}"; exit 1; }

          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "docker rm -f manyfaced 2>/dev/null || true"
          ssh -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -p "${DROPLET_SSH_PORT}" "${DROPLET_SSH_USER}@${DROPLET_SERVER_IP}" "docker run -d --name manyfaced --restart unless-stopped --network host --user 1001:1001 --env HOME=/opt/manyfaced/bots --env XDG_CONFIG_HOME=/opt/manyfaced/host-config --env-file /opt/manyfaced/honeypot.env -v /home/honeypot/.config/manyfaced:/opt/manyfaced/host-config/manyfaced:ro -v /opt/manyfaced/bots:/opt/manyfaced/bots '${PREV_IMG}'"
          echo "Rollback successful — container running on ${PREV_IMG}"
