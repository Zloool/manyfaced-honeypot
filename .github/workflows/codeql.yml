name: "CodeQL"

# SAST. Runs on push-to-master and a weekly schedule only (issue #256) — it no
# longer runs on pull_request, so it doesn't double-run against ci.yml. Merged
# commits are still analyzed every push; PR authors get fast feedback from ci.yml
# instead of waiting on the expensive CodeQL scan.
on:
  push:
    branches: [master]
  schedule:
    - cron: "27 4 * * 1"  # weekly, Mondays ~04:27 UTC

jobs:
  analyze:
    name: Analyze (Python)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
          # Tune queries: default + security-and-quality for deeper SAST.
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:${{ matrix.language }}"
