name: Build Image

# Builds the Docker image (issue #146) and runs a smoke check so the container
# build can't silently rot — the same drift problem the repo already fights for
# docs. This workflow does NOT deploy and is NOT a required status check, so it
# runs in parallel without blocking merges.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build image + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: manyfaced:ci
          load: true

      - name: "Smoke: generate-config runs inside the image"
        # Confirms the installed package + console script work in the container.
        run: docker run --rm manyfaced:ci manyfaced --generate-config

      - name: "Smoke: compose config is valid"
        run: docker compose config --quiet
