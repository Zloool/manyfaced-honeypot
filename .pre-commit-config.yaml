repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  # Docs/code drift check (matches CI `docs-drift` job).
  # Runs with the Python that pre-commit was installed under (the same venv
  # created by `pip install -e ".[dev]"`), so it does NOT require `uv`/`uvx`
  # — see issue #219. CI uses `pip install -e ".[dev]"`, not uv.
  - repo: local
    hooks:
      - id: docs-drift
        name: docs-drift
        entry: python .github/workflows/scripts/check_docs_drift.py
        language: system
        pass_filenames: false
        files: ^(manyfaced/|docs/|\.github/workflows/scripts/)

  # basedpyright type check (matches CI `Typecheck` jobs).
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: basedpyright manyfaced/
        language: system
        pass_filenames: false
        files: ^manyfaced/

  # actionlint for GitHub Actions workflow edits (matches CI `Lint GitHub Actions workflows`).
  # Prefer a system-installed actionlint binary; fall back to `uvx` only if uv
  # is present, so contributors who follow AGENTS.md (pip-based setup) are not
  # blocked by a missing `uv` (issue #219).
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: bash -c 'if command -v actionlint >/dev/null 2>&1; then actionlint "${@:1}"; elif command -v uvx >/dev/null 2>&1; then uvx actionlint "${@:1}"; else echo "actionlint not installed (pip install actionlint, or install uv for uvx)"; exit 1; fi' bash
        language: system
        files: ^\.github/workflows/
        pass_filenames: false
